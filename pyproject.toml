[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kraken-df-demo"
version = "0.2.3"
description = "Local coherent KrakenSDR direction-finding demo with BFT decoders and replay"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1", "uvicorn[standard]>=0.27,<1", "pydantic>=2.6,<3",
  "numpy>=1.26,<3", "scipy>=1.12,<2", "openpyxl>=3.1,<4", "httpx>=0.27,<1"
]

[project.optional-dependencies]
gps = ["pyserial>=3.5,<4"]
daq = ["pyserial>=3.5,<4", "pyzmq>=25,<28", "scikit-rf>=1.0,<2", "numba>=0.61,<0.64", "numpy>=1.26,<2.3"]

[project.scripts]
krakendf = "krakendf.__main__:main"

[tool.setuptools.packages.find]
include = ["krakendf*"]

[tool.setuptools.package-data]
krakendf = ["static/*", "static/vendor/**/*", "resources/*.json"]
